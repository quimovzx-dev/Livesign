<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>LiveSign — Sign Language Recognition</title>
  <link rel="stylesheet" href="style.css">
</head><body>  <div class="app"><header>
  <div class="logo">Live<span>Sign</span></div>
  <div class="status">
    <span id="statusDot"></span>
    <span id="statusText">Camera off</span>
  </div>
</header>

<main>

  <section class="camera-card">

    <video id="camera" autoplay playsinline muted></video>

    <canvas id="output"></canvas>

    <div class="camera-overlay">
      <div class="corner top-left"></div>
      <div class="corner top-right"></div>
      <div class="corner bottom-left"></div>
      <div class="corner bottom-right"></div>
    </div>

    <div class="camera-message" id="cameraMessage">
      <div class="camera-icon">✋</div>
      <h2>Show your hand</h2>
      <p>Start the camera and make a sign</p>
    </div>

  </section>

  <section class="recognition">

    <div class="prediction">
      <span class="label">DETECTED SIGN</span>
      <div id="letter">—</div>
      <div id="confidence">Waiting...</div>
    </div>

    <div class="word-box">
      <div class="word-header">
        <span>LIVE TEXT</span>
        <button id="clearBtn">CLEAR</button>
      </div>

      <div id="text">—</div>
    </div>

  </section>

  <section class="controls">
    <button id="startBtn" class="primary">
      Start Camera
    </button>

    <button id="spaceBtn">
      SPACE
    </button>

    <button id="backBtn">
      ⌫
    </button>
  </section>

  <p class="hint">
    Hold a sign steadily for recognition. Press SPACE to add the
    detected letter to your text.
  </p>

</main>

<footer>
  <span>LiveSign V1.0</span>
  <span>Client-side processing</span>
</footer>

  </div>  <!-- MediaPipe -->  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>  <script src="app.js"></script></body>
</html>
